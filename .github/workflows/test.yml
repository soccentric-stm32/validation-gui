name: test

# Runtime tests on every OS this project ships to.
#
# build.yml only packages on tags, and its matrix never runs the PySide6
# runtime, so without this job the GUI is exercised on Linux and the developer
# machine only.  Keep the OS list in step with build.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-13, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - run: python -m pytest -q tests
      - name: CLI simulator smoke
        shell: bash
        run: |
          # The simulator fails ADC.004 on purpose, so the CLI exits 1 on every
          # OS; assert on the transcript instead of the exit code.
          python -m hwval_studio --cli --simulate hwval --group ADC --no-report > cli.txt 2>&1 || true
          cat cli.txt
          grep -q "run finished: aborted=False" cli.txt
