[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwval-studio"
version = "0.1.0"
description = "HWVAL Studio - STM32F767ZI hardware validation, firmware update and SWD flashing GUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandesh Ghimire", email = "sandesh@soccentric.com" }]
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "flatbuffers>=23.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt", "ruff>=0.6", "mypy>=1.10"]
packaging = ["pyinstaller>=6.6"]

[project.scripts]
hwval-studio = "hwval_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwval_studio = ["resources/**/*", "docs/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105", "SIM108", "RUF001", "RUF012", "RUF034", "RUF059", "B007", "B008"]

[tool.ruff.lint.per-file-ignores]
# Shared verbatim with the other SoCcentric GUIs; its noqa tags serve their rules.
"src/hwval_studio/ui/soc_terminal.py" = ["RUF100"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
